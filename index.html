<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BokBocken – Begagnade böcker</title>

    <link rel="icon" type="image/png" sizes="32x32" href="bilder/favicon.png">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="bilder/favicon.ico">

    <meta name="description"
        content="BokBocken säljer begagnade böcker med fokus på hållbarhet, återbruk och läsglädje.">

    <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="style.css">
    </noscript>

</head>

<body>

    <a class="skip-link" href="#main-content">Hoppa till innehåll</a>

    <header class="site-header">
        <nav class="nav" aria-label="Huvudnavigation">

            <a href="index.html" class="logo">
                <img src="bilder/logo.svg" alt="BokBocken – logotyp" width="180" height="80">
            </a>

            <a href="index.html" class="site-title">BOKBOCKEN</a>

            <button class="menu-toggle" aria-expanded="false" aria-controls="main-menu" aria-label="Öppna meny">
                ☰
            </button>

            <ul class="nav-list" id="main-menu">
                <li><a href="products.html">Böcker</a></li>
                <li><a href="about.html">Om BokBocken</a></li>
                <li><a href="cart.html">Varukorg</a></li>
            </ul>

        </nav>
    </header>

    <main id="main-content">

        

        <section class="hero">
<h2 class="visually-hidden">Välkommen till </h2>
            <video class="hero-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
                <source src="filmer/vidbak1.mp4" type="video/mp4">
                <source src="video/vidbak1.webm" type="video/webm">
                Din webbläsare stödjer inte video.
            </video>

            <div class="hero-text hero-branding">

                <img src="bilder/logo.svg" alt="BokBocken – begagnade böcker" class="hero-logo" width="420"
                    height="220">

                <a href="products.html" class="btn">Se alla böcker till salu</a>

            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 BokBocken</p>
    </footer>

    <!-- Hamburgermeny -->
    <script>
        const toggle = document.querySelector('.menu-toggle');
        const menu = document.querySelector('.nav-list');

        toggle.addEventListener('click', () => {
            const expanded = toggle.getAttribute('aria-expanded') === 'true';
            toggle.setAttribute('aria-expanded', !expanded);
            menu.classList.toggle('show');
        });
    </script>

</body>

</html>
